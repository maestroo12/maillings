<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Undangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fafaf9; --panel:#fff; --soft:#f3f3f1; --text:#1c1c1b; --muted:#85857f; --line:#e7e7e3;
    --acc:#1c1c1b; --onacc:#fff; --danger:#c8402f; color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#121212; --panel:#1a1a19; --soft:#242423; --text:#ecece8; --muted:#8e8e88;
      --line:#2d2d2b; --acc:#ecece8; --onacc:#121212; --danger:#ef7f73; color-scheme:dark; }
  }
  :root[data-theme="dark"] { --bg:#121212; --panel:#1a1a19; --soft:#242423; --text:#ecece8; --muted:#8e8e88;
    --line:#2d2d2b; --acc:#ecece8; --onacc:#121212; --danger:#ef7f73; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 "Inter",system-ui,"Segoe UI",sans-serif; min-height:100vh; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:2px solid var(--text); outline-offset:2px; }
  [hidden] { display:none !important; }
  h1, h2, h3 { margin:0; font-weight:600; }
  h2 { font-size:1rem; }
  ul { list-style:none; margin:0; padding:0; }

  .wrap { max-width:860px; margin:0 auto; padding:32px 20px 72px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .brand { font-size:1.3rem; letter-spacing:-.01em; }
  .who { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .btn { border:1px solid var(--acc); background:var(--acc); color:var(--onacc); border-radius:8px; padding:7px 14px; font-size:.82rem; transition:opacity .2s; }
  .btn:hover { opacity:.85; }
  .ghost { background:transparent; color:var(--text); border-color:var(--line); }
  .ghost:hover { opacity:1; border-color:var(--muted); }
  #avatar { width:32px; height:32px; border-radius:50%; object-fit:cover; }
  #note { margin:10px 0 28px; font-size:.78rem; color:var(--muted); }

  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .stat small { display:block; color:var(--muted); font-size:.76rem; }
  .stat b { display:block; font-size:1.5rem; font-weight:600; line-height:1.3; margin-top:2px; }
  .stat span { display:block; color:var(--muted); font-size:.74rem; min-height:1.1em; }

  .feat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:24px; margin:12px 0 40px; }
  .feat .t { font-size:1.3rem; font-weight:600; letter-spacing:-.01em; word-break:break-word; }
  .feat .d { margin-top:4px; color:var(--muted); font-size:.88rem; }
  .feat .a { color:var(--muted); font-size:.88rem; }
  #dIsi { margin:16px 0 0; padding-top:16px; border-top:1px solid var(--line); font-size:.92rem; line-height:1.7; white-space:pre-line; }

  .lh { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:8px; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; }
  .tools input, .tools select { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 12px; font-size:.82rem; outline:0; }
  .tools input { width:210px; }
  .tools input:focus, .tools select:focus, dialog input:focus, dialog textarea:focus { border-color:var(--muted); }
  li.item { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.4fr) 32px; gap:16px; align-items:center;
    padding:14px 12px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .2s; }
  li.item:last-child { border-bottom:0; }
  li.item:hover, li.item.sel { background:var(--soft); }
  li.item.sel { box-shadow:inset 2px 0 0 var(--acc); }
  .nm { font-weight:500; font-size:.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tg { font-size:.82rem; color:var(--muted); }
  .al { font-size:.82rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kb { border:0; background:none; width:32px; height:32px; border-radius:8px; font-size:1.1rem; line-height:1; color:var(--muted); }
  .kb:hover { background:var(--line); color:var(--text); }
  .empty { padding:36px; text-align:center; color:var(--muted); font-size:.88rem; }

  .chartbox { margin-top:48px; }
  .ch-h { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .days { display:flex; gap:4px; overflow-x:auto; }
  .day { border:0; background:none; color:var(--muted); border-radius:8px; padding:5px 12px; font-size:.8rem; }
  .day:hover { color:var(--text); }
  .day[aria-pressed="true"] { background:var(--acc); color:var(--onacc); }
  .leg { display:flex; gap:16px; font-size:.75rem; color:var(--muted); margin-top:10px; }
  .leg i { display:inline-block; width:14px; border-top:2px solid var(--text); vertical-align:middle; margin-right:6px; }
  .leg i.bar { height:8px; border:0; background:var(--muted); opacity:.5; }
  .tip { min-height:22px; font-size:.82rem; margin:8px 0 4px; }
  #chart { width:100%; height:auto; display:block; touch-action:pan-y; }
  .area { opacity:.07; }
  .bar-r:hover { opacity:.7 !important; }
  .sum { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .hrs { display:grid; grid-template-columns:repeat(12,1fr); gap:6px; margin-top:12px; }
  .hr { border:1px solid var(--line); border-radius:8px; padding:8px 0; text-align:center; font-size:.7rem; color:var(--muted); background:var(--panel); }
  .hr b { display:block; font-size:.92rem; color:var(--text); font-weight:500; }
  .hr.now { border-color:var(--acc); }

  .swap-out { opacity:0; transition:opacity .2s; }
  .swap-in { animation:fadeIn .3s ease; }
  @keyframes fadeIn { from { opacity:0; } }

  .menu { position:fixed; z-index:20; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:4px; min-width:140px; box-shadow:0 8px 24px rgba(0,0,0,.12); }
  .menu button { display:block; width:100%; text-align:left; background:none; border:0; padding:8px 12px; border-radius:7px; font-size:.82rem; }
  .menu button:hover { background:var(--soft); } .menu .del { color:var(--danger); }
  dialog { border:1px solid var(--line); border-radius:12px; padding:24px; width:min(460px,92vw); background:var(--panel); color:var(--text); }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  dialog form { display:grid; gap:14px; }
  label { display:grid; gap:5px; font-size:.8rem; color:var(--muted); }
  dialog input, dialog textarea { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px; width:100%; outline:0; }
  dialog textarea { resize:vertical; min-height:72px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .acts { display:flex; gap:8px; justify-content:flex-end; margin-top:4px; }

  @media (max-width:640px) {
    .wrap { padding:20px 16px 56px; }
    .stats, .sum { gap:8px; } .stat { padding:12px; } .stat b { font-size:1.2rem; }
    .tools { width:100%; } .tools input { flex:1; width:auto; }
    li.item { grid-template-columns:minmax(0,1fr) 32px; gap:2px 12px; padding:12px 8px; }
    li.item .nm { grid-column:1; white-space:normal; } li.item .tg, li.item .al { grid-column:1; }
    li.item .kb { grid-column:2; grid-row:1 / 4; }
    .hrs { grid-template-columns:repeat(6,1fr); }
    .two { grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">Undangan</h1>
    <div class="who">
      <button id="theme" class="btn ghost" aria-label="Ganti tema">Mode gelap</button>
      <button id="navAdd" class="btn" hidden>Tambah undangan</button>
      <button id="btnLogin" class="btn">Masuk dengan Google</button>
      <button id="navOut" class="btn ghost" hidden>Keluar</button>
      <img id="avatar" alt="" hidden>
    </div>
  </header>
  <p id="note"></p>

  <section class="stats" aria-label="Ringkasan">
    <div class="stat"><small>Total undangan</small><b id="tTotal">0</b><span></span></div>
    <div class="stat"><small>Akan datang</small><b id="tUp">0</b><span id="tNextLbl">Belum ada</span></div>
    <div class="stat"><small>Data lengkap</small><b id="pct">0%</b><span></span></div>
  </section>

  <section class="feat" id="feat">
    <div id="hero"></div>
    <p id="dIsi">-</p>
  </section>

  <section>
    <div class="lh">
      <h2>Daftar undangan</h2>
      <div class="tools">
        <input id="search" type="search" placeholder="Cari nama, tanggal, alamat" aria-label="Cari">
        <select id="sort" aria-label="Urutkan"><option value="nama">Urut: Nama</option><option value="tgl">Urut: Tanggal</option></select>
      </div>
    </div>
    <ul id="rows"></ul>
    <div id="empty" class="empty" hidden>Belum ada data.</div>
  </section>

  <section class="chartbox">
    <div class="ch-h"><h2>Undangan per bulan</h2><div class="days" id="days"></div></div>
    <div class="leg"><span><i></i>Kumulatif</span><span><i class="bar"></i>Per bulan</span></div>
    <div class="tip" id="tip"></div>
    <svg id="chart" viewBox="0 0 800 260" role="img" aria-label="Grafik jumlah undangan per bulan"></svg>
    <div class="sum" id="sum"></div>
    <div class="hrs" id="hrs"></div>
  </section>
</div>

<div class="menu" id="menu" hidden><button data-a="edit">Edit</button><button data-a="del" class="del">Hapus</button></div>

<dialog id="dlg">
  <form id="form">
    <h3 id="dlgTitle">Tambah undangan</h3>
    <div class="two"><label>Nama pengantin 1 <input id="nama1" maxlength="60" required></label>
      <label>Nama pengantin 2 <input id="nama2" maxlength="60" required></label></div>
    <label>Isi teks undangan <textarea id="isi" maxlength="255"></textarea></label>
    <div class="two"><label>Tanggal <input id="tanggal" maxlength="100" placeholder="12 Februari 2026"></label>
      <label>Alamat <input id="alamat" maxlength="255"></label></div>
    <div class="acts"><button type="button" class="btn ghost" id="btnCancel">Batal</button><button class="btn" type="submit">Simpan</button></div>
  </form>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyCSGV2bpUjurXbV9bfom2SqfIphJAkysEs",
  authDomain: "accesdb-2d40a.firebaseapp.com",
  databaseURL: "https://accesdb-2d40a-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "accesdb-2d40a",
  storageBucket: "accesdb-2d40a.firebasestorage.app",
  messagingSenderId: "380401065303",
  appId: "1:380401065303:web:f4742f03a71f285924b212"
});
const db = getDatabase(app), auth = getAuth(app), listRef = ref(db, "daftar");
const OWNERS = ["piemanjordan4@gmail.com", "emmachan00000@gmail.com"];
const FIELDS = ["nama1", "nama2", "isi", "tanggal", "alamat"];
const BULAN = ["januari","februari","maret","april","mei","juni","juli","agustus","september","oktober","november","desember"];
const BLN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const BLN3 = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
let user = null, data = {}, selId = null, menuId = null, editId = null, year = null;

const isOwner = () => !!user && OWNERS.includes(user.email);
const title = (v) => (v.nama1 || "") + " & " + (v.nama2 || "");
function parseTgl(s) {
  const m = /(\d{1,2})\s+([a-zA-Z]+)\s+(\d{4})/.exec(s || "");
  if (!m) return null;
  const i = BULAN.indexOf(m[2].toLowerCase());
  return i < 0 ? null : new Date(+m[3], i, +m[1]);
}
const short = (d) => d.getDate() + " " + BLN3[d.getMonth()] + " " + d.getFullYear();

// angka menghitung naik
function setNum(el, to, dec = 0, suf = "", dur = 800) {
  const from = el._v || 0, tok = (el._t = {});
  el._v = to;
  if (reduce || from === to) { el.textContent = to.toFixed(dec) + suf; return; }
  const t0 = performance.now();
  (function f(t) {
    if (el._t !== tok) return;
    const k = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - k, 3);
    el.textContent = (from + (to - from) * e).toFixed(dec) + suf;
    if (k < 1) requestAnimationFrame(f);
  })(t0);
}

function derive() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const all = Object.entries(data).filter(([, v]) => v).map(([id, v]) => ({ id, ...v, d: parseTgl(v.tanggal) }));
  const upcoming = all.filter((v) => v.d && v.d >= today).sort((a, b) => a.d - b.d);
  const q = $("search").value.trim().toLowerCase(), byTgl = $("sort").value === "tgl";
  const list = all.filter((v) => !q || [v.nama1, v.nama2, v.tanggal, v.alamat].some((x) => (x || "").toLowerCase().includes(q)))
    .sort((a, b) => byTgl ? (a.d ? a.d.getTime() : Infinity) - (b.d ? b.d.getTime() : Infinity) : title(a).localeCompare(title(b)));
  const hero = all.find((v) => v.id === selId) || upcoming[0] || list[0] || null;
  return { today, all, upcoming, list, hero };
}

function note() {
  let m;
  if (location.protocol === "file:") m = "Buka lewat alamat https (GitHub Pages) atau localhost. Login Google tidak jalan kalau file dibuka langsung.";
  else if (!user) m = "Mode lihat saja. Masuk dengan " + OWNERS.join(" atau ") + " untuk mengelola data.";
  else if (!isOwner()) m = "Anda masuk sebagai " + user.email + ", bukan akun yang diizinkan. Hanya bisa melihat.";
  else m = "Masuk sebagai " + user.email + ".";
  $("note").textContent = m;
}

// ---------- auth ----------
$("btnLogin").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch((e) => alert("Gagal masuk: " + e.message));
$("navOut").onclick = () => signOut(auth);
$("navAdd").onclick = () => openForm(null);
onAuthStateChanged(auth, (u) => {
  user = u;
  $("btnLogin").hidden = !!u;
  $("avatar").hidden = !u || !u.photoURL;
  if (u) { $("avatar").src = u.photoURL || ""; $("avatar").title = u.email; }
  $("navAdd").hidden = !isOwner();
  $("navOut").hidden = !u;
  note(); renderList();
});

onValue(listRef, (snap) => {
  data = snap.val() || {};
  const { hero, all } = derive();
  const years = yearsOf(all);
  if (year === null || !years.includes(year)) year = hero && hero.d ? hero.d.getFullYear() : new Date().getFullYear();
  renderTop(); renderList(); renderYears(); renderChart();
}, (err) => { $("note").textContent = "Gagal membaca data: " + err.message; });

// ---------- undangan terpilih & ringkasan ----------
function renderTop() {
  const { all, upcoming, hero } = derive();
  const h = $("hero"); h.textContent = "";
  const mk = (cls, txt) => { const e = document.createElement("div"); e.className = cls; e.textContent = txt; return e; };
  if (!hero) h.append(mk("t", "Belum ada data"));
  else h.append(mk("t", title(hero)), mk("d", hero.tanggal || "-"), mk("a", hero.alamat || ""));
  setNum($("tTotal"), all.length); setNum($("tUp"), upcoming.length);
  $("tNextLbl").textContent = upcoming[0] ? "Terdekat " + short(upcoming[0].d) : "Belum ada";
  $("dIsi").textContent = hero && hero.isi ? hero.isi : "-";
  const done = all.filter((v) => FIELDS.every((f) => (v[f] || "").trim())).length;
  setNum($("pct"), all.length ? Math.round((done / all.length) * 100) : 0, 0, "%");
}

// ---------- daftar ----------
function renderList() {
  const { list, hero } = derive();
  const ul = $("rows"); ul.textContent = "";
  $("empty").hidden = list.length > 0;
  list.forEach((v) => {
    const li = document.createElement("li");
    li.className = "item" + (hero && v.id === hero.id ? " sel" : "");
    li.dataset.id = v.id; li.tabIndex = 0;
    const cell = (cls, txt) => { const d = document.createElement("div"); d.className = cls; d.textContent = txt; return d; };
    li.append(cell("nm", title(v)), cell("tg", v.tanggal || ""), cell("al", v.alamat || ""));
    const kb = document.createElement("button");
    kb.className = "kb"; kb.textContent = "⋮"; kb.setAttribute("aria-label", "Menu"); kb.hidden = !isOwner();
    kb.onclick = (e) => { e.stopPropagation(); showMenu(v.id, kb); };
    li.appendChild(kb);
    li.onclick = () => selectHero(v.id);
    li.onkeydown = (e) => { if (e.key === "Enter") selectHero(v.id); };
    ul.appendChild(li);
  });
}
$("search").oninput = () => renderList();
$("sort").onchange = () => renderList();

let swapBusy = false;
function selectHero(id) {
  const cur = derive().hero;
  if (swapBusy || (cur && cur.id === id)) return;
  swapBusy = true;
  const el = $("feat");
  el.classList.add("swap-out");
  setTimeout(() => {
    selId = id; renderTop();
    document.querySelectorAll("li.item").forEach((li) => li.classList.toggle("sel", li.dataset.id === id));
    el.classList.remove("swap-out"); el.classList.add("swap-in");
    const h = derive().hero;
    if (h && h.d && h.d.getFullYear() !== year) changeYear(h.d.getFullYear());
    setTimeout(() => { el.classList.remove("swap-in"); swapBusy = false; }, 320);
  }, 200);
}

// ---------- tab tahun ----------
const yearsOf = (all) => [...new Set([new Date().getFullYear(), ...all.filter((v) => v.d).map((v) => v.d.getFullYear())])].sort();
function renderYears() {
  $("days").innerHTML = yearsOf(derive().all).map((y) =>
    '<button class="day" data-y="' + y + '" aria-pressed="' + (y === year) + '">' + y + "</button>").join("");
}
$("days").onclick = (e) => { const b = e.target.closest(".day"); if (b) changeYear(+b.dataset.y); };
let yBusy = false;
function changeYear(y) {
  if (y === year || yBusy) return;
  yBusy = true;
  const els = [$("chart"), $("sum"), $("hrs"), $("tip")];
  year = y;
  document.querySelectorAll(".day").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.y === year));
  els.forEach((e) => e.classList.add("swap-out"));
  setTimeout(() => {
    renderChart();
    els.forEach((e) => { e.classList.remove("swap-out"); e.classList.add("swap-in"); });
    setTimeout(() => { els.forEach((e) => e.classList.remove("swap-in")); yBusy = false; }, 320);
  }, 200);
}

// ---------- grafik ----------
const W = 800, H = 260, L = 34, R = 14, TP = 14, BT = 26;
function renderChart() {
  const { all, today } = derive();
  const counts = Array(12).fill(0);
  all.forEach((v) => { if (v.d && v.d.getFullYear() === year) counts[v.d.getMonth()]++; });
  let run = 0; const cum = counts.map((c) => (run += c));
  const total = run, mx = total <= 4 ? 4 : Math.ceil(total / 4) * 4;
  const x = (i) => L + i * (W - L - R) / 11, y = (v) => H - BT - v / mx * (H - TP - BT);
  let s = "";
  for (let k = 0; k <= 4; k++) { const v = mx * k / 4;
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" font-size="11" text-anchor="end" fill="var(--muted)">' + v + "</text>"; }
  counts.forEach((c, i) => { if (c > 0) s += '<rect class="bar-r" x="' + (x(i) - 13) + '" y="' + y(c) + '" width="26" height="' + (H - BT - y(c)) + '" rx="4" fill="var(--muted)" opacity=".35"/>'; });
  const pts = cum.map((v, i) => [x(i), y(v)]);
  let d = "M" + pts[0][0] + " " + pts[0][1];
  for (let i = 1; i < 12; i++) { const a = pts[i - 1], b = pts[i], m = (a[0] + b[0]) / 2; d += " C" + m + " " + a[1] + " " + m + " " + b[1] + " " + b[0] + " " + b[1]; }
  s += '<path class="area" d="' + d + " L" + pts[11][0] + " " + (H - BT) + " L" + pts[0][0] + " " + (H - BT) + 'Z" fill="var(--text)"/>' +
       '<path d="' + d + '" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/>';
  BLN3.forEach((m, i) => { s += '<text x="' + x(i) + '" y="' + (H - 8) + '" font-size="11" text-anchor="middle" fill="var(--muted)">' + m + "</text>"; });
  if (year === today.getFullYear()) { const m = today.getMonth();
    s += '<line x1="' + x(m) + '" x2="' + x(m) + '" y1="' + TP + '" y2="' + (H - BT) + '" stroke="var(--muted)" stroke-dasharray="3 4"/>' +
         '<circle cx="' + x(m) + '" cy="' + y(cum[m]) + '" r="5" fill="var(--panel)" stroke="var(--text)" stroke-width="2"/>'; }
  s += '<line id="cur" y1="' + TP + '" y2="' + (H - BT) + '" stroke="var(--text)" opacity="0"/><circle id="dot" r="5" fill="var(--text)" opacity="0"/>';
  $("chart").innerHTML = s;

  const peak = Math.max(...counts), peakM = peak > 0 ? counts.indexOf(peak) : -1;
  const upY = all.filter((v) => v.d && v.d >= today && v.d.getFullYear() === year).length;
  const items = [["Undangan tahun " + year, total, "n"], ["Bulan terpadat", peakM >= 0 ? BLN[peakM] + " (" + peak + ")" : "-", "t"], ["Akan datang", upY, "n"]];
  $("sum").innerHTML = items.map(() => '<div class="stat"><small></small><b>0</b></div>').join("");
  document.querySelectorAll("#sum .stat").forEach((el, i) => {
    el.querySelector("small").textContent = items[i][0];
    const b = el.querySelector("b");
    if (items[i][2] === "n") setNum(b, items[i][1], 0, "", 700); else b.textContent = items[i][1];
  });
  $("hrs").innerHTML = BLN3.map((m, i) => '<div class="hr' + (year === today.getFullYear() && i === today.getMonth() ? " now" : "") +
    '">' + m + "<b>" + counts[i] + "</b></div>").join("");
  const defTip = "Tahun " + year + " · geser pada grafik untuk detail bulan";
  $("tip").textContent = defTip;

  const svg = $("chart");
  const move = (e) => {
    const r = svg.getBoundingClientRect();
    let i = Math.round(((e.clientX - r.left) / r.width * W - L) / ((W - L - R) / 11));
    i = Math.max(0, Math.min(11, i));
    $("cur").setAttribute("x1", x(i)); $("cur").setAttribute("x2", x(i)); $("cur").setAttribute("opacity", .3);
    $("dot").setAttribute("cx", x(i)); $("dot").setAttribute("cy", y(cum[i])); $("dot").setAttribute("opacity", 1);
    $("tip").textContent = BLN[i] + " " + year + " · " + counts[i] + " undangan · kumulatif " + cum[i];
  };
  svg.onpointermove = move; svg.onpointerdown = move;
  svg.onpointerleave = () => { $("cur").setAttribute("opacity", 0); $("dot").setAttribute("opacity", 0); $("tip").textContent = defTip; };
}

// ---------- menu titik tiga ----------
function showMenu(id, btn) {
  menuId = id;
  const r = btn.getBoundingClientRect(), m = $("menu");
  m.hidden = false;
  m.style.top = r.bottom + 4 + "px";
  m.style.left = Math.max(8, r.right - m.offsetWidth) + "px";
}
document.addEventListener("click", () => { $("menu").hidden = true; });
$("menu").onclick = async (e) => {
  const a = e.target.dataset.a; if (!a || !menuId) return;
  if (a === "edit") openForm(menuId);
  if (a === "del") {
    const v = data[menuId];
    if (confirm("Hapus undangan " + title(v) + "?")) {
      try { await remove(ref(db, "daftar/" + menuId)); } catch (err) { alert("Gagal menghapus: " + err.message); }
    }
  }
};

// ---------- form ----------
function openForm(id) {
  if (!isOwner()) return;
  editId = id;
  $("form").reset();
  if (id) FIELDS.forEach((f) => ($(f).value = data[id][f] || ""));
  $("dlgTitle").textContent = id ? "Edit undangan" : "Tambah undangan";
  $("dlg").showModal();
  $("nama1").focus();
}
$("btnCancel").onclick = () => $("dlg").close();
$("form").onsubmit = async (e) => {
  e.preventDefault();
  if (!isOwner()) return;
  const rec = {}; FIELDS.forEach((f) => (rec[f] = $(f).value.trim()));
  try {
    if (editId) await set(ref(db, "daftar/" + editId), rec);
    else { const nr = push(listRef); selId = nr.key; await set(nr, rec); }
    $("dlg").close();
  } catch (err) { alert("Gagal menyimpan: " + err.message); }
};

// ---------- tema ----------
const root = document.documentElement, tbtn = $("theme");
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
const lab = () => (tbtn.textContent = isDark() ? "Mode terang" : "Mode gelap");
tbtn.onclick = () => { root.dataset.theme = isDark() ? "light" : "dark"; lab(); };
lab(); note();
</script>
