<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<title>Undangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fafaf9; --panel:#fff; --soft:#f3f3f1; --text:#1c1c1b; --muted:#76766f; --line:#e7e7e3;
    --acc:#1c1c1b; --onacc:#fff; --danger:#c8402f; --ok:#1f9d63; color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#121212; --panel:#1a1a19; --soft:#242423; --text:#ecece8; --muted:#92928b;
      --line:#2d2d2b; --acc:#ecece8; --onacc:#121212; --danger:#ef7f73; --ok:#3ecf8e; color-scheme:dark; }
  }
  :root[data-theme="dark"] { --bg:#121212; --panel:#1a1a19; --soft:#242423; --text:#ecece8; --muted:#92928b;
    --line:#2d2d2b; --acc:#ecece8; --onacc:#121212; --danger:#ef7f73; --ok:#3ecf8e; color-scheme:dark; }

  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; min-height:100dvh; overflow-wrap:anywhere; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
  :focus-visible { outline:2px solid var(--text); outline-offset:2px; }
  [hidden] { display:none !important; }
  h1, h2, h3, p { margin:0; }
  h1, h2, h3 { font-weight:600; }
  h2 { font-size:1rem; }
  ul { list-style:none; margin:0; padding:0; }

  .wrap { width:100%; max-width:820px; margin:0 auto;
    padding:max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(64px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }

  /* header */
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand { display:flex; align-items:center; gap:10px; min-width:0; flex-shrink:0; }
  .brand h1 { font-size:1.25rem; letter-spacing:-.01em; white-space:nowrap; }
  .live { display:inline-flex; align-items:center; gap:6px; font-size:.72rem; color:var(--muted);
    border:1px solid var(--line); border-radius:99px; padding:2px 9px; white-space:nowrap; }
  .live i { width:7px; height:7px; border-radius:50%; background:var(--muted); }
  .live.on i { background:var(--ok); box-shadow:0 0 0 0 var(--ok); animation:pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent); } 70%,100% { box-shadow:0 0 0 6px transparent; } }
  .who { display:flex; align-items:center; gap:8px; }
  .btn { border:1px solid var(--acc); background:var(--acc); color:var(--onacc); border-radius:10px; padding:0 14px; min-height:36px;
    font-size:.82rem; font-weight:500; white-space:nowrap; transition:opacity .15s; }
  .btn:hover { opacity:.85; }
  .ghost { background:transparent; color:var(--text); border-color:var(--line); }
  .ghost:hover { opacity:1; border-color:var(--muted); }
  .icon { width:36px; padding:0; font-size:1rem; }
  #avatar { width:32px; height:32px; border-radius:50%; object-fit:cover; }
  #note { margin:10px 0 24px; font-size:.78rem; color:var(--muted); }

  /* ringkasan */
  .stats { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; min-width:0; }
  .stat small { display:block; color:var(--muted); font-size:.74rem; }
  .stat b { display:block; font-size:1.45rem; font-weight:600; line-height:1.3; margin-top:2px; font-variant-numeric:tabular-nums;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stat span { display:block; color:var(--muted); font-size:.72rem; line-height:1.35; margin-top:2px; }

  /* undangan terpilih */
  .feat { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; margin:10px 0 36px; }
  .feat .t { font-size:clamp(1.15rem, 3.6vw + .5rem, 1.6rem); font-weight:600; letter-spacing:-.01em; line-height:1.3; text-wrap:balance; }
  .feat .t.stack { white-space:pre-line; text-align:center; }
  .feat .t.stack + .d, .feat .t.stack ~ .a { text-align:center; }
  .feat .d { margin-top:6px; color:var(--text); font-size:.9rem; }
  .feat .a { margin-top:2px; color:var(--muted); font-size:.88rem; }
  #dIsi { margin-top:16px; padding-top:16px; border-top:1px solid var(--line); font-size:.92rem; line-height:1.7; white-space:pre-line; }

  /* daftar */
  .lh { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:8px; }
  .tools { display:flex; gap:8px; flex:1 1 280px; justify-content:flex-end; min-width:0; }
  .tools input, .tools select { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:0 12px; min-height:38px; font-size:.85rem; outline:0; min-width:0; }
  .tools input { flex:1 1 0; width:0; max-width:260px; }
  .tools input:focus, .tools select:focus, dialog input:focus, dialog textarea:focus { border-color:var(--muted); }
  .list { background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  li.item { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.5fr) 36px; gap:4px 16px; align-items:center;
    padding:12px 8px 12px 16px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .15s; }
  li.item:last-child { border-bottom:0; }
  li.item:hover { background:var(--soft); }
  li.item.sel { background:var(--soft); box-shadow:inset 3px 0 0 var(--acc); }
  .nm { font-weight:500; font-size:.9rem; line-height:1.35; white-space:pre-line; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .tg, .al { font-size:.82rem; color:var(--muted); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .kb { border:0; background:none; width:36px; height:36px; border-radius:10px; font-size:1.15rem; line-height:1; color:var(--muted); }
  .kb:hover { background:var(--line); color:var(--text); }
  .empty { padding:36px 16px; text-align:center; color:var(--muted); font-size:.88rem; }

  /* grafik */
  .chartbox { margin-top:44px; }
  .ch-h { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .days { display:flex; gap:4px; overflow-x:auto; max-width:100%; scrollbar-width:none; }
  .days::-webkit-scrollbar { display:none; }
  .day { border:0; background:none; color:var(--muted); border-radius:8px; padding:0 12px; min-height:32px; font-size:.8rem; }
  .day:hover { color:var(--text); }
  .day[aria-pressed="true"] { background:var(--acc); color:var(--onacc); }
  .leg { display:flex; gap:16px; font-size:.75rem; color:var(--muted); margin-top:8px; }
  .leg i { display:inline-block; width:14px; border-top:2px solid var(--text); vertical-align:middle; margin-right:6px; }
  .leg i.bar { height:8px; border:0; background:var(--muted); opacity:.5; }
  .tip { min-height:22px; font-size:.82rem; margin:8px 0 2px; }
  #chart { width:100%; display:block; touch-action:pan-y; user-select:none; -webkit-user-select:none; }
  .area { opacity:.07; }
  .sum { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; margin-top:14px; }
  .hrs { display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); gap:6px; margin-top:12px; }
  .hr { border:1px solid var(--line); border-radius:10px; padding:7px 0; text-align:center; font-size:.68rem; color:var(--muted); background:var(--panel); }
  .hr b { display:block; font-size:.9rem; color:var(--text); font-weight:500; }
  .hr.now { border-color:var(--acc); }

  .flash { animation:flash .6s ease; }
  @keyframes flash { from { background:var(--soft); } }

  /* menu & dialog */
  .menu { position:fixed; z-index:20; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:4px; min-width:150px; box-shadow:0 10px 30px rgba(0,0,0,.14); }
  .menu button { display:block; width:100%; text-align:left; background:none; border:0; padding:10px 12px; border-radius:8px; font-size:.86rem; }
  .menu button:hover { background:var(--soft); } .menu .del { color:var(--danger); }
  dialog { border:1px solid var(--line); border-radius:16px; padding:22px; width:min(480px, calc(100vw - 24px)); max-height:calc(100dvh - 24px); overflow:auto;
    background:var(--panel); color:var(--text); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  dialog form { display:grid; gap:14px; }
  label { display:grid; gap:5px; font-size:.8rem; color:var(--muted); }
  dialog input, dialog textarea { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; width:100%; outline:0; font-size:16px; }
  dialog textarea { resize:vertical; min-height:84px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .acts { display:flex; gap:8px; justify-content:flex-end; }
  .acts .btn { min-height:40px; }

  @media (max-width:640px) {
    .wrap { padding-top:max(18px, env(safe-area-inset-top)); }
    .stats, .sum { gap:8px; } .stat { padding:12px 10px; } .stat b { font-size:1.2rem; }
    .feat { padding:18px; margin-bottom:30px; }
    .lh { align-items:stretch; } .lh h2 { width:100%; } .tools { flex-basis:100%; justify-content:stretch; } .tools input { max-width:none; }
    li.item { grid-template-columns:minmax(0,1fr) 36px; gap:2px 8px; padding:12px 6px 12px 14px; }
    li.item .nm, li.item .tg, li.item .al { grid-column:1; }
    li.item .nm { -webkit-line-clamp:5; }
    li.item .kb { grid-column:2; grid-row:1 / 4; align-self:center; }
    .hrs { grid-template-columns:repeat(6, minmax(0,1fr)); }
    .two { grid-template-columns:1fr; }
    .acts .btn { flex:1; }
  }
  @media (max-width:380px) { .live span { display:none; } .live { padding:2px 7px; } }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Undangan</h1>
      <span class="live" id="live" title="Status koneksi"><i></i><span id="liveTxt">Menghubungkan</span></span>
    </div>
    <div class="who">
      <button id="theme" class="btn ghost icon" aria-label="Ganti tema">☾</button>
      <button id="navAdd" class="btn" hidden>+ Tambah</button>
      <button id="btnLogin" class="btn" title="Masuk dengan Google">Masuk</button>
      <button id="navOut" class="btn ghost" hidden>Keluar</button>
      <img id="avatar" alt="" hidden>
    </div>
  </header>
  <p id="note"></p>

  <section class="stats" aria-label="Ringkasan">
    <div class="stat"><small>Total</small><b id="tTotal">0</b><span>&nbsp;</span></div>
    <div class="stat"><small>Akan datang</small><b id="tUp">0</b><span id="tNextLbl">Belum ada</span></div>
    <div class="stat"><small>Data lengkap</small><b id="pct">0%</b><span>&nbsp;</span></div>
  </section>

  <section class="feat" id="feat">
    <div id="hero"></div>
    <p id="dIsi">-</p>
  </section>

  <section>
    <div class="lh">
      <h2>Daftar undangan</h2>
      <div class="tools">
        <input id="search" type="search" placeholder="Cari nama, tanggal, alamat" aria-label="Cari">
        <select id="sort" aria-label="Urutkan"><option value="nama">Nama</option><option value="tgl">Tanggal</option></select>
      </div>
    </div>
    <div class="list">
      <ul id="rows"></ul>
      <div id="empty" class="empty" hidden>Belum ada data.</div>
    </div>
  </section>

  <section class="chartbox">
    <div class="ch-h"><h2>Undangan per bulan</h2><div class="days" id="days"></div></div>
    <div class="leg"><span><i></i>Kumulatif</span><span><i class="bar"></i>Per bulan</span></div>
    <div class="tip" id="tip"></div>
    <svg id="chart" role="img" aria-label="Grafik jumlah undangan per bulan"></svg>
    <div class="sum" id="sum"></div>
    <div class="hrs" id="hrs"></div>
  </section>
</div>

<div class="menu" id="menu" hidden><button data-a="edit">Edit</button><button data-a="del" class="del">Hapus</button></div>

<dialog id="dlg">
  <form id="form">
    <h3 id="dlgTitle">Tambah undangan</h3>
    <div class="two"><label>Nama pengantin 1 <input id="nama1" maxlength="60" required autocomplete="off"></label>
      <label>Nama pengantin 2 <input id="nama2" maxlength="60" required autocomplete="off"></label></div>
    <label>Isi teks undangan <textarea id="isi" maxlength="255"></textarea></label>
    <div class="two"><label>Tanggal <input id="tanggal" maxlength="100" placeholder="12 Februari 2026" autocomplete="off"></label>
      <label>Alamat <input id="alamat" maxlength="255" autocomplete="off"></label></div>
    <div class="acts"><button type="button" class="btn ghost" id="btnCancel">Batal</button><button class="btn" type="submit">Simpan</button></div>
  </form>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyCSGV2bpUjurXbV9bfom2SqfIphJAkysEs",
  authDomain: "accesdb-2d40a.firebaseapp.com",
  databaseURL: "https://accesdb-2d40a-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "accesdb-2d40a",
  storageBucket: "accesdb-2d40a.firebasestorage.app",
  messagingSenderId: "380401065303",
  appId: "1:380401065303:web:f4742f03a71f285924b212"
});
const db = getDatabase(app), auth = getAuth(app), listRef = ref(db, "daftar");
const OWNERS = ["piemanjordan4@gmail.com", "emmachan00000@gmail.com"];
const FIELDS = ["nama1", "nama2", "isi", "tanggal", "alamat"];
const BULAN = ["januari","februari","maret","april","mei","juni","juli","agustus","september","oktober","november","desember"];
const BLN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const BLN3 = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
let user = null, data = {}, selId = null, menuId = null, editId = null, year = null, lastSync = null, loaded = false;

const isOwner = () => !!user && OWNERS.includes(user.email);
const title = (v) => (v.nama1 || "") + " & " + (v.nama2 || "");
// nama panjang: "&" di tengah, di barisnya sendiri
const stacked = (v, max) => title(v).length > max ? (v.nama1 || "") + "\n&\n" + (v.nama2 || "") : title(v);
const pad = (n) => String(n).padStart(2, "0");
function parseTgl(s) {
  const m = /(\d{1,2})\s+([a-zA-Z]+)\s+(\d{4})/.exec(s || "");
  if (!m) return null;
  const i = BULAN.indexOf(m[2].toLowerCase());
  return i < 0 ? null : new Date(+m[3], i, +m[1]);
}
const short = (d) => d.getDate() + " " + BLN3[d.getMonth()] + " " + d.getFullYear();

// angka menghitung naik
function setNum(el, to, suf = "", dur = 700) {
  const from = el._v || 0, tok = (el._t = {});
  el._v = to;
  if (reduce || from === to) { el.textContent = to + suf; return; }
  const t0 = performance.now();
  (function f(t) {
    if (el._t !== tok) return;
    const k = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from) * e) + suf;
    if (k < 1) requestAnimationFrame(f);
  })(t0);
}

function derive() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const all = Object.entries(data).filter(([, v]) => v).map(([id, v]) => ({ id, ...v, d: parseTgl(v.tanggal) }));
  const upcoming = all.filter((v) => v.d && v.d >= today).sort((a, b) => a.d - b.d);
  const q = $("search").value.trim().toLowerCase(), byTgl = $("sort").value === "tgl";
  const list = all.filter((v) => !q || [v.nama1, v.nama2, v.tanggal, v.alamat].some((x) => (x || "").toLowerCase().includes(q)))
    .sort((a, b) => byTgl ? (a.d ? a.d.getTime() : Infinity) - (b.d ? b.d.getTime() : Infinity) : title(a).localeCompare(title(b)));
  const hero = all.find((v) => v.id === selId) || upcoming[0] || list[0] || null;
  return { today, all, upcoming, list, hero };
}

function note() {
  let m;
  if (location.protocol === "file:") m = "Buka lewat alamat https (GitHub Pages) atau localhost. Login Google tidak jalan kalau file dibuka langsung.";
  else if (!user) m = "Mode lihat saja. Masuk dengan akun pemilik untuk mengelola data.";
  else if (!isOwner()) m = "Masuk sebagai " + user.email + ". Akun ini tidak diizinkan, hanya bisa melihat.";
  else m = "Masuk sebagai " + user.email + ".";
  if (lastSync) m += " · Diperbarui " + pad(lastSync.getHours()) + ":" + pad(lastSync.getMinutes()) + ":" + pad(lastSync.getSeconds());
  $("note").textContent = m;
}

// ---------- status koneksi (realtime) ----------
onValue(ref(db, ".info/connected"), (s) => {
  const on = s.val() === true;
  $("live").classList.toggle("on", on);
  $("liveTxt").textContent = on ? "Live" : "Offline";
});

// ---------- auth ----------
$("btnLogin").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch((e) => alert("Gagal masuk: " + e.message));
$("navOut").onclick = () => signOut(auth);
$("navAdd").onclick = () => openForm(null);
onAuthStateChanged(auth, (u) => {
  user = u;
  $("btnLogin").hidden = !!u;
  $("avatar").hidden = !u || !u.photoURL;
  if (u) { $("avatar").src = u.photoURL || ""; $("avatar").title = u.email; }
  $("navAdd").hidden = !isOwner();
  $("navOut").hidden = !u;
  note(); renderList();
});

// ---------- data realtime: setiap ada perubahan di database, tampilan ikut berubah ----------
onValue(listRef, (snap) => {
  data = snap.val() || {};
  lastSync = new Date();
  const { hero, all } = derive();
  const years = yearsOf(all);
  if (year === null || !years.includes(year)) year = hero && hero.d ? hero.d.getFullYear() : new Date().getFullYear();
  renderTop(); renderList(); renderYears(); renderChart(); note();
  if (loaded && !reduce) { $("feat").classList.remove("flash"); void $("feat").offsetWidth; $("feat").classList.add("flash"); }
  loaded = true;
}, (err) => { $("note").textContent = "Gagal membaca data: " + err.message; });

// ---------- undangan terpilih & ringkasan ----------
function renderTop() {
  const { all, upcoming, hero } = derive();
  const h = $("hero"); h.textContent = "";
  const mk = (cls, txt) => { const e = document.createElement("div"); e.className = cls; e.textContent = txt; return e; };
  if (!hero) h.append(mk("t", "Belum ada data"));
  else {
    const t = mk("t", stacked(hero, 24));
    if (title(hero).length > 24) t.classList.add("stack");
    h.append(t);
    if (hero.tanggal) h.append(mk("d", hero.tanggal));
    if (hero.alamat) h.append(mk("a", hero.alamat));
  }
  setNum($("tTotal"), all.length); setNum($("tUp"), upcoming.length);
  $("tNextLbl").textContent = upcoming[0] ? "Terdekat " + short(upcoming[0].d) : "Belum ada";
  $("dIsi").textContent = hero && hero.isi ? hero.isi : "-";
  const done = all.filter((v) => FIELDS.every((f) => (v[f] || "").trim())).length;
  setNum($("pct"), all.length ? Math.round((done / all.length) * 100) : 0, "%");
}

// ---------- daftar ----------
function renderList() {
  const { list, hero } = derive();
  const ul = $("rows"); ul.textContent = "";
  $("empty").hidden = list.length > 0;
  list.forEach((v) => {
    const li = document.createElement("li");
    li.className = "item" + (hero && v.id === hero.id ? " sel" : "");
    li.dataset.id = v.id; li.tabIndex = 0;
    const cell = (cls, txt) => { const d = document.createElement("div"); d.className = cls; d.textContent = txt; d.title = txt; return d; };
    const nmEl = cell("nm", stacked(v, 30)); nmEl.title = title(v);
    li.append(nmEl, cell("tg", v.tanggal || ""), cell("al", v.alamat || ""));
    const kb = document.createElement("button");
    kb.className = "kb"; kb.textContent = "⋮"; kb.setAttribute("aria-label", "Menu"); kb.hidden = !isOwner();
    kb.onclick = (e) => { e.stopPropagation(); showMenu(v.id, kb); };
    li.appendChild(kb);
    li.onclick = () => selectHero(v.id);
    li.onkeydown = (e) => { if (e.key === "Enter") selectHero(v.id); };
    ul.appendChild(li);
  });
}
$("search").oninput = () => renderList();
$("sort").onchange = () => renderList();

function selectHero(id) {
  selId = id;
  renderTop(); renderList();
  const h = derive().hero;
  if (h && h.d && h.d.getFullYear() !== year) changeYear(h.d.getFullYear());
  if (innerWidth <= 640) $("feat").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
}

// ---------- tab tahun ----------
const yearsOf = (all) => [...new Set([new Date().getFullYear(), ...all.filter((v) => v.d).map((v) => v.d.getFullYear())])].sort();
function renderYears() {
  $("days").innerHTML = yearsOf(derive().all).map((y) =>
    '<button class="day" data-y="' + y + '" aria-pressed="' + (y === year) + '">' + y + "</button>").join("");
}
$("days").onclick = (e) => { const b = e.target.closest(".day"); if (b) changeYear(+b.dataset.y); };
function changeYear(y) { if (y === year) return; year = y; renderYears(); renderChart(); }

// ---------- grafik (lebar mengikuti layar, teks selalu terbaca) ----------
const H = 230, L = 32, R = 20, TP = 12, BT = 26;
function renderChart() {
  const svg = $("chart"), { all, today } = derive();
  const W = Math.max(280, Math.round(svg.getBoundingClientRect().width || 760));
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  const narrow = W < 460, step = (W - L - R) / 11, bw = Math.min(26, step * 0.55);
  const counts = Array(12).fill(0);
  all.forEach((v) => { if (v.d && v.d.getFullYear() === year) counts[v.d.getMonth()]++; });
  let run = 0; const cum = counts.map((c) => (run += c));
  const total = run, mx = total <= 4 ? 4 : Math.ceil(total / 4) * 4;
  const x = (i) => L + i * step, y = (v) => H - BT - v / mx * (H - TP - BT);
  let s = "";
  for (let k = 0; k <= 4; k++) { const v = mx * k / 4;
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" font-size="11" text-anchor="end" fill="var(--muted)">' + v + "</text>"; }
  counts.forEach((c, i) => { if (c > 0) s += '<rect x="' + (x(i) - bw / 2) + '" y="' + y(c) + '" width="' + bw + '" height="' + (H - BT - y(c)) + '" rx="4" fill="var(--muted)" opacity=".35"/>'; });
  const pts = cum.map((v, i) => [x(i), y(v)]);
  let d = "M" + pts[0][0] + " " + pts[0][1];
  for (let i = 1; i < 12; i++) { const a = pts[i - 1], b = pts[i], m = (a[0] + b[0]) / 2; d += " C" + m + " " + a[1] + " " + m + " " + b[1] + " " + b[0] + " " + b[1]; }
  s += '<path class="area" d="' + d + " L" + pts[11][0] + " " + (H - BT) + " L" + pts[0][0] + " " + (H - BT) + 'Z" fill="var(--text)"/>' +
       '<path d="' + d + '" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/>';
  BLN3.forEach((m, i) => { s += '<text x="' + x(i) + '" y="' + (H - 8) + '" font-size="11" text-anchor="middle" fill="var(--muted)">' + (narrow ? m[0] : m) + "</text>"; });
  if (year === today.getFullYear()) { const m = today.getMonth();
    s += '<line x1="' + x(m) + '" x2="' + x(m) + '" y1="' + TP + '" y2="' + (H - BT) + '" stroke="var(--muted)" stroke-dasharray="3 4"/>' +
         '<circle cx="' + x(m) + '" cy="' + y(cum[m]) + '" r="5" fill="var(--panel)" stroke="var(--text)" stroke-width="2"/>'; }
  s += '<line id="cur" y1="' + TP + '" y2="' + (H - BT) + '" stroke="var(--text)" opacity="0"/><circle id="dot" r="5" fill="var(--text)" opacity="0"/>';
  svg.innerHTML = s;

  const peak = Math.max(...counts), peakM = peak > 0 ? counts.indexOf(peak) : -1;
  const upY = all.filter((v) => v.d && v.d >= today && v.d.getFullYear() === year).length;
  const items = [["Tahun " + year, total, "n"], ["Terpadat", peakM >= 0 ? BLN3[peakM] + " (" + peak + ")" : "-", "t"], ["Akan datang", upY, "n"]];
  $("sum").innerHTML = items.map(() => '<div class="stat"><small></small><b>0</b></div>').join("");
  document.querySelectorAll("#sum .stat").forEach((el, i) => {
    el.querySelector("small").textContent = items[i][0];
    const b = el.querySelector("b");
    if (items[i][2] === "n") setNum(b, items[i][1]); else b.textContent = items[i][1];
  });
  $("hrs").innerHTML = BLN3.map((m, i) => '<div class="hr' + (year === today.getFullYear() && i === today.getMonth() ? " now" : "") +
    '">' + m + "<b>" + counts[i] + "</b></div>").join("");
  const defTip = "Tahun " + year + " · sentuh grafik untuk detail bulan";
  $("tip").textContent = defTip;

  const move = (e) => {
    const r = svg.getBoundingClientRect();
    let i = Math.round(((e.clientX - r.left) / r.width * W - L) / step);
    i = Math.max(0, Math.min(11, i));
    $("cur").setAttribute("x1", x(i)); $("cur").setAttribute("x2", x(i)); $("cur").setAttribute("opacity", .3);
    $("dot").setAttribute("cx", x(i)); $("dot").setAttribute("cy", y(cum[i])); $("dot").setAttribute("opacity", 1);
    $("tip").textContent = BLN[i] + " " + year + " · " + counts[i] + " undangan · kumulatif " + cum[i];
  };
  svg.onpointermove = move; svg.onpointerdown = move;
  svg.onpointerleave = () => { $("cur").setAttribute("opacity", 0); $("dot").setAttribute("opacity", 0); $("tip").textContent = defTip; };
}
let lastW = 0;
new ResizeObserver(() => {
  const w = Math.round($("chart").getBoundingClientRect().width);
  if (Math.abs(w - lastW) > 2) { lastW = w; if (loaded) renderChart(); }
}).observe($("chart"));

// ---------- menu titik tiga ----------
function showMenu(id, btn) {
  menuId = id;
  const r = btn.getBoundingClientRect(), m = $("menu");
  m.hidden = false;
  const top = r.bottom + 4 + m.offsetHeight > innerHeight ? r.top - 4 - m.offsetHeight : r.bottom + 4;
  m.style.top = Math.max(8, top) + "px";
  m.style.left = Math.max(8, Math.min(r.right - m.offsetWidth, innerWidth - m.offsetWidth - 8)) + "px";
}
const closeMenu = () => { $("menu").hidden = true; };
document.addEventListener("click", closeMenu);
addEventListener("scroll", closeMenu, { passive: true });
addEventListener("resize", closeMenu);
$("menu").onclick = async (e) => {
  const a = e.target.dataset.a; if (!a || !menuId) return;
  if (a === "edit") openForm(menuId);
  if (a === "del") {
    const v = data[menuId];
    if (v && confirm("Hapus undangan " + title(v) + "?")) {
      try { await remove(ref(db, "daftar/" + menuId)); } catch (err) { alert("Gagal menghapus: " + err.message); }
    }
  }
};

// ---------- form ----------
function openForm(id) {
  if (!isOwner()) return;
  editId = id;
  $("form").reset();
  if (id && data[id]) FIELDS.forEach((f) => ($(f).value = data[id][f] || ""));
  $("dlgTitle").textContent = id ? "Edit undangan" : "Tambah undangan";
  $("dlg").showModal();
  $("nama1").focus();
}
$("btnCancel").onclick = () => $("dlg").close();
$("form").onsubmit = async (e) => {
  e.preventDefault();
  if (!isOwner()) return;
  const rec = {}; FIELDS.forEach((f) => (rec[f] = $(f).value.trim()));
  try {
    if (editId) await set(ref(db, "daftar/" + editId), rec);
    else { const nr = push(listRef); selId = nr.key; await set(nr, rec); }
    $("dlg").close();
  } catch (err) { alert("Gagal menyimpan: " + err.message); }
};

// ---------- tema ----------
const root = document.documentElement, tbtn = $("theme");
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
const lab = () => { tbtn.textContent = isDark() ? "☀" : "☾"; };
tbtn.onclick = () => { root.dataset.theme = isDark() ? "light" : "dark"; lab(); };
matchMedia("(prefers-color-scheme:dark)").addEventListener("change", lab);
lab(); note();
</script>
