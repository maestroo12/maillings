<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Undangan</title>
<style>
  :root { --bg:#f5f6f3; --surface:#fff; --text:#1d2420; --muted:#66706a; --line:#d9ddd7; --accent:#1f6f5c; --accent-text:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151a17; --surface:#1d2420; --text:#e8ece8; --muted:#94a09a; --line:#2f3833; --accent:#4cb597; --accent-text:#0e1612; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:24px 16px 64px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  h1 { font-size:1.5rem; margin:0; }
  #status { color:var(--muted); font-size:.9rem; }
  button, input, textarea { font:inherit; }
  button { border:1px solid var(--line); background:var(--surface); color:var(--text); padding:8px 14px; border-radius:6px; cursor:pointer; }
  button.primary { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  form { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px; display:grid; gap:14px; }
  .row { display:grid; gap:14px; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); }
  label { display:grid; gap:4px; font-size:.9rem; color:var(--muted); }
  input, textarea { padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); width:100%; }
  input:disabled, textarea:disabled { opacity:.75; }
  textarea { resize:vertical; min-height:72px; }
  .preview { margin-top:16px; color:var(--muted); font-size:.9rem; }
  .preview b { color:var(--text); font-weight:600; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Data Undangan</h1>
      <div id="status">Menghubungkan ke Firebase…</div>
    </div>
    <div>
      <button id="btnLogin" class="primary">Masuk dengan Google</button>
      <button id="btnLogout" hidden>Keluar</button>
    </div>
  </header>

  <form id="form">
    <div class="row">
      <label>Nama pengantin 1 <input id="nama1" maxlength="60" required></label>
      <label>Nama pengantin 2 <input id="nama2" maxlength="60" required></label>
    </div>
    <label>Isi teks undangan <textarea id="isi" maxlength="255"></textarea></label>
    <label>Tanggal <input id="tanggal" maxlength="100" placeholder="12 Februari 2026"></label>
    <label>Alamat <textarea id="alamat" maxlength="255"></textarea></label>
    <div><button class="primary" type="submit" id="btnSave" hidden>Simpan</button></div>
  </form>

  <p class="preview">Di Word: inisial <b id="pvInisial">-</b>, judul <b id="pvNama">-</b></p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyCSGV2bpUjurXbV9bfom2SqfIphJAkysEs",
  authDomain: "accesdb-2d40a.firebaseapp.com",
  databaseURL: "https://accesdb-2d40a-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "accesdb-2d40a",
  storageBucket: "accesdb-2d40a.firebasestorage.app",
  messagingSenderId: "380401065303",
  appId: "1:380401065303:web:f4742f03a71f285924b212"
});
const db = getDatabase(app);
const auth = getAuth(app);
const dataRef = ref(db, "undangan");

const OWNER = "emmachan00000@gmail.com";
const FIELDS = ["nama1", "nama2", "isi", "tanggal", "alamat"];
const $ = (id) => document.getElementById(id);
let user = null;

const isOwner = () => !!user && user.email === OWNER;

function lockForm() {
  const ok = isOwner();
  FIELDS.forEach((f) => ($(f).disabled = !ok));
  $("btnSave").hidden = !ok;
}

function preview() {
  const a = $("nama1").value.trim(), b = $("nama2").value.trim();
  $("pvInisial").textContent = (a.charAt(0) + " " + b.charAt(0)).toUpperCase().trim() || "-";
  $("pvNama").textContent = (a && b ? a + " & " + b : a || b).toUpperCase() || "-";
}
FIELDS.forEach((f) => $(f).addEventListener("input", preview));

$("btnLogin").onclick = () => signInWithPopup(auth, new GoogleAuthProvider())
  .catch((e) => alert("Gagal masuk: " + e.message));
$("btnLogout").onclick = () => signOut(auth);

onAuthStateChanged(auth, (u) => {
  user = u;
  $("btnLogin").hidden = !!u;
  $("btnLogout").hidden = !u;
  lockForm();
});

let editing = false;
onValue(dataRef, (snap) => {
  const v = snap.val() || {};
  $("status").textContent = "Tersinkron realtime";
  // jangan timpa ketikan yang sedang diedit
  if (editing && isOwner()) return;
  FIELDS.forEach((f) => ($(f).value = v[f] || ""));
  preview();
}, (err) => { $("status").textContent = "Gagal membaca data: " + err.message; });

FIELDS.forEach((f) => $(f).addEventListener("input", () => { editing = true; }));

$("form").onsubmit = async (e) => {
  e.preventDefault();
  if (!isOwner()) return;
  const rec = {};
  FIELDS.forEach((f) => (rec[f] = $(f).value.trim()));
  try {
    await set(dataRef, rec);
    editing = false;
    $("status").textContent = "Tersimpan";
  } catch (err) {
    alert("Gagal menyimpan: " + err.message);
  }
};

lockForm();
</script>
</body>
</html>
